name: lint-backend

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: /root/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: cd apps/api && uv sync

      - name: Run Ruff check
        run: cd apps/api && uv run ruff check .

      - name: Run MyPy
        run: cd apps/api && uv run mypy src

      - name: Run import-linter
        run: cd apps/api && uv run lint-imports
