[project]
name = "ai-book-chat-api"
version = "0.1.0"
description = "PDF RAG Chat backend — FastAPI API + Celery worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "pgvector>=0.3",
    "python-multipart>=0.0.20",
    "pymupdf>=1.25",
    "openai>=1.60",
    "anthropic>=0.69",
    "huggingface-hub>=0.28",
    "tiktoken>=0.8",
    "tenacity>=9.0",
    # Runtime, not just tests: the Ollama adapters talk HTTP directly.
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

# Celery's decorators (@shared_task, signal .connect) are untyped upstream.
[[tool.mypy.overrides]]
module = ["app.worker.*"]
disallow_untyped_decorators = false

# PyMuPDF ships py.typed but leaves its Document/Page methods unannotated.
[[tool.mypy.overrides]]
module = ["app.ingestion.extract"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -m 'not live'"
# INFO so `logger.info(..., extra={...})` actually builds a LogRecord under test:
# a reserved key there (e.g. "filename") only raises once logging is enabled.
log_level = "INFO"
markers = [
    "live: hits a real provider API — needs OPENAI_API_KEY or HF_TOKEN, excluded from the default run",
]
