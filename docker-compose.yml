services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookchat}
      POSTGRES_DB: ${POSTGRES_DB:-bookchat}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookchat} -d ${POSTGRES_DB:-bookchat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    # The container has no `.env` on disk, so provider keys and model overrides
    # have to be injected. `environment:` below still wins, which is what keeps
    # the in-network postgres/redis hostnames from being clobbered by the
    # localhost URLs the host tooling reads out of the same file.
    env_file:
      - .env
    environment:
      <<: &backend_env
        DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bookchat}:${POSTGRES_PASSWORD:-bookchat}@postgres:5432/${POSTGRES_DB:-bookchat}
        REDIS_URL: redis://redis:6379/0
        CELERY_BROKER_URL: redis://redis:6379/0
        CELERY_RESULT_BACKEND: redis://redis:6379/1
        UPLOAD_DIR: /data/uploads
        LOG_LEVEL: ${LOG_LEVEL:-INFO}
        CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
        OPENAI_API_KEY: ${OPENAI_API_KEY:-}
        ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
        # Ollama runs on the host, not in the compose network, so `localhost`
        # from `.env` would resolve to the container itself.
        #
        # Port 11435, not the default 11434: the packaged systemd service binds
        # 127.0.0.1 only, which refuses the bridge gateway. A second `ollama
        # serve` on 0.0.0.0:11435 shares the same model store and needs no root.
        # To go back to one server, add the drop-in below and set 11434 here:
        #   /etc/systemd/system/ollama.service.d/override.conf
        #   [Service]
        #   Environment="OLLAMA_HOST=0.0.0.0:11434"
        OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11435}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/alembic:/app/alembic
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: ./apps/api
    # PDF parsing is CPU-bound; the default (one child per core) would let two
    # big books saturate the machine.
    command: celery -A app.worker.celery_app worker -l info --concurrency=2
    env_file:
      - .env
    environment:
      <<: *backend_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/api/src:/app/src
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
