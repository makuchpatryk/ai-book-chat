services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookchat}
      POSTGRES_DB: ${POSTGRES_DB:-bookchat}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookchat} -d ${POSTGRES_DB:-bookchat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    # Host networking (Linux): the container reaches the host's default Ollama
    # at localhost:11434, and postgres/redis through their published ports.
    network_mode: host
    # The container has no `.env` on disk, so provider keys and model overrides
    # have to be injected. `environment:` below still wins over `.env`.
    env_file:
      - .env
    environment:
      <<: &backend_env
        DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bookchat}:${POSTGRES_PASSWORD:-bookchat}@localhost:5432/${POSTGRES_DB:-bookchat}
        REDIS_URL: redis://localhost:6379/0
        CELERY_BROKER_URL: redis://localhost:6379/0
        CELERY_RESULT_BACKEND: redis://localhost:6379/1
        UPLOAD_DIR: /data/uploads
        LOG_LEVEL: ${LOG_LEVEL:-INFO}
        CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
        OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://localhost:11434}
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/alembic:/app/alembic
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: ./apps/api
    # PDF parsing is CPU-bound; the default (one child per core) would let two
    # big books saturate the machine.
    command: celery -A app.interfaces.worker.celery_app worker -l info --concurrency=2
    env_file:
      - .env
    environment:
      <<: *backend_env
    network_mode: host
    volumes:
      - ./apps/api/src:/app/src
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
